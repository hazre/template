[tasks.pin-actions]
description = "Pin GitHub Actions to SHA commit hashes"
run = "mise exec pinact -- pinact run -u"

[tasks.audit-actions]
description = "Audit GitHub Actions for security issues"
run = "mise exec zizmor -- zizmor .github/workflows"

